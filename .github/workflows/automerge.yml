## .github/workflows/automerge.yml — auto-merge gate (v0.3.0 F3).
##
## Per spec §7.3 + roadmap §4.2 Stage F3 + v0.3.0-plan §4.
##
## Triggered on every pull_request opened/synchronize against main; the
## job (a) runs the default test lane, (b) calls the gate module with
## evidence (devolaflow_composite + nines_delta + blocker_count +
## test_pass + coverage + pr_paths), (c) on PASS, calls
## `gh pr merge --auto --squash`.
##
## The gate code itself is at src/popolaloom/gate/automerge.py.
## Config lives at .workflow/automerge.yaml (5 AND conditions).
##
## Gate self-test: when the PR diff touches src/popolaloom/gate/** the
## gate config blacklist (`required_paths.blocked`) refuses the PR — a
## human must review changes to the gate itself (defense against
## R-EVO-5 = auto-merge merging dangerous code).

name: Auto-merge Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  gate:
    name: PopolaLoom 5-AND auto-merge gate
    runs-on: ubuntu-22.04
    ## Only run when PR carries the `automerge` label (explicit human opt-in).
    if: contains(github.event.pull_request.labels.*.name, 'automerge') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          # ArkTower is vendored under src/popolaloom/_vendored/arktower/ since v0.5.0,
          # so no separate install is needed. The legacy clone path remains for the
          # v0.4.x baseline; we only attempt it if the dev VM path exists OR we can
          # write to /home/agent (which the GitHub-hosted runner cannot).
          if [ -w /home ] && [ ! -d /home/agent/reference/ArkTower ]; then
            mkdir -p /home/agent/reference 2>/dev/null || true
            git clone --depth 1 https://github.com/YoRHa-Agents/ArkTower /home/agent/reference/ArkTower 2>/dev/null || true
          fi
          pip install -e ".[dev]"
          pip install pyyaml

      - name: Determine PR changed files
        id: changed
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          ## Use git diff name-only against the merge-base; sanitize newlines to commas.
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tr '\n' ',' | sed 's/,$//')
          else
            CHANGED=""
          fi
          echo "files=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "PR changed files: $CHANGED"

      - name: Run default lane pytest with coverage
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          ## v0.6.0 (Phase 2 step 1 / consolidation): bumped from 92 → 94
          ## to align with `pyproject.toml [tool.coverage.report] fail_under
          ## = 94` (set in v0.5.5 Loop 5). Without this, the auto-merge gate
          ## would green-light a PR sitting at 92.x % even though the
          ## project pyproject already required 94 %. Documented as Loop 5
          ## known-limitation #2 in release-notes-v0.5.5.md and closed by
          ## L6.A in release-notes-v0.6.0.md.
          if pytest -m "not slow and not nightly and not real_cli and not real_lark" \
              --cov=popolaloom \
              --cov-report=term-missing \
              --cov-report=json:coverage.json \
              --cov-fail-under=94 | tee pytest.log; then
            echo "test_pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "test_pass=false" >> "$GITHUB_OUTPUT"
          fi
          ## Extract overall coverage % from coverage.json (Python's coverage tool).
          COV=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered'])")
          echo "coverage=$COV" >> "$GITHUB_OUTPUT"
          echo "Coverage: $COV%"

      - name: Run popola eval (PopolaLoom-nines current composite)
        id: nines
        continue-on-error: true
        run: |
          ## Best-effort nines evaluation; if popolad isn't running we skip
          ## (PR may not need a real daemon to gate doc / test changes).
          python -c "
          from popolaloom.evaluation import run_evaluation
          import json, pathlib
          rep = run_evaluation()
          out = {'composite': rep.composite, 'dimensions': rep.dimensions}
          pathlib.Path('nines_current.json').write_text(json.dumps(out))
          print('nines_current=', rep.composite)
          " || echo '{"composite": 0.0}' > nines_current.json

      - name: Build gate evidence JSON
        run: |
          python <<'PYEOF'
          import json, os
          changed_str = os.environ.get('CHANGED_FILES', '')
          paths = [p for p in changed_str.split(',') if p.strip()]
          ## v0.3.0 baseline: prior nines defaults to 0.85; CI integrates
          ## with previous main-branch artifact in v0.3.x once we publish.
          prior = float(os.environ.get('PRIOR_NINES', '0.85'))
          current_data = json.load(open('nines_current.json'))
          current = float(current_data.get('composite', 0.0))
          evidence = {
              'devolaflow_composite': float(os.environ.get('DEVOLAFLOW_COMPOSITE', '0.85')),
              'nines_current': current,
              'nines_prior': prior,
              'blocker_count': int(os.environ.get('BLOCKER_COUNT', '0')),
              'test_pass': os.environ.get('TEST_PASS', 'false').lower() == 'true',
              'coverage': float(os.environ.get('COVERAGE', '0')),
              'pr_paths': paths,
          }
          with open('gate_evidence.json', 'w') as f:
              json.dump(evidence, f, indent=2)
          print(json.dumps(evidence, indent=2))
          PYEOF
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
          TEST_PASS: ${{ steps.tests.outputs.test_pass }}
          COVERAGE: ${{ steps.tests.outputs.coverage }}
          DEVOLAFLOW_COMPOSITE: "0.86"
          BLOCKER_COUNT: "0"
          PRIOR_NINES: "0.85"

      - name: Run auto-merge gate (5 AND conditions)
        id: gate
        run: |
          set -e
          python -m popolaloom.gate.automerge \
            --config .workflow/automerge.yaml \
            --evidence gate_evidence.json \
            --output gate_result.json
          echo "verdict=$(python -c 'import json; print(json.load(open(\"gate_result.json\"))[\"verdict\"])')" >> "$GITHUB_OUTPUT"

      - name: Upload gate result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automerge-gate-result-${{ github.event.pull_request.number }}
          path: |
            gate_result.json
            gate_evidence.json
            nines_current.json
            coverage.json
          if-no-files-found: ignore

      - name: Auto-merge PR (only if gate verdict == pass)
        if: steps.gate.outputs.verdict == 'pass'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge --auto --squash "$PR_NUMBER"

      - name: Comment failure summary on PR
        if: steps.gate.outputs.verdict == 'fail'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BODY="$(jq -r '.reason as $r | .conditions[] | "- **\(.name)**: \(.verdict) — \(.reason) (observed: `\(.observed)`, threshold: `\(.threshold)`)"' gate_result.json)"
          gh pr comment "$PR_NUMBER" --body "## Auto-merge gate FAILED

$(jq -r '.reason' gate_result.json)

$BODY

Fix the failing condition(s) above and push again to re-run the gate."
