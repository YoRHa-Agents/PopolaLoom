# .github/workflows/cloud-fixtures-drift-check.yml
#
# v0.9.0 Stage 2 W2.1 T2.1.3 — scheduled drift detection for the
# committed Cursor Cloud fixtures under `tests/fixtures/cloud/`.
#
# Per `fixtures-strategy.md` §5 (Q-D-2 lock: monthly + workflow_dispatch).
#
# Two trigger paths, by design:
#
#   1. `schedule:` — `0 6 1 * *` (1st of every month, 06:00 UTC, low-
#      traffic window). The maintainer's `CURSOR_API_KEY` repo secret
#      replays the Tier-4 `tests/real_cursor_cloud/` smoke quartet
#      against the live Cursor Cloud Agents REST + SSE API, and any
#      non-zero pytest exit is treated as a drift signal.
#   2. `workflow_dispatch:` — release engineers / on-call run this
#      on demand before tagging a v0.9.x patch (or right after Cursor
#      announces an API change in their changelog).
#
# Cheap-side coverage: the SHA-256 lock test
# (`tests/test_fixtures_locked.py`) already runs on every PR via the
# default `ci.yml` lane, so this workflow does NOT duplicate that.
# We re-run it here as a sanity gate before the live job — if the lock
# itself is broken, there is no point spending API quota.
#
# Fork safety: forks cannot read the maintainer's `CURSOR_API_KEY`
# secret, so the live capture step checks the env var inside bash and
# exits 0 with a friendly skip message when it is unset. Do NOT use
# `secrets.*` in a job-level `if:` expression — GitHub rejects that at
# workflow validation time. No red X on contributor forks.
#
# Drift surfacing: when the live job fails, an issue is filed via
# `gh issue create` with the `fixtures-drift` label. The on-call
# release engineer triages within 48 h per `fixtures-strategy.md` §5.2.
# The semantic-diff renderer (`scripts/diff_captured_against_fixtures.py`)
# is deferred to a v0.9.x patch; for v0.9.0 W2.1 we use the existing
# smoke suite's pass/fail as a tracer-bullet drift signal and surface
# the pytest log tail in the issue body.

name: cloud-fixtures-drift-check

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    name: capture live API + diff against tests/fixtures/cloud/
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cheap SHA-256 lock check (must always pass first)
        run: pytest tests/test_fixtures_locked.py -q --no-header

      - name: Capture live Cursor Cloud responses + diff vs. tests/fixtures/cloud/
        id: drift
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          POPOLA_TEST_CLOUD_REPO_URL: https://github.com/YoRHa-Agents/PopolaLoom
        run: |
          set -uo pipefail
          mkdir -p .drift/captured
          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "skipping: CURSOR_API_KEY not configured (set as repo secret)" | tee .drift/captured/pytest.log
            echo "pytest_rc=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Replay the Tier-4 cloud smoke suite; this hits the real API.
          # The semantic-diff renderer is deferred to v0.9.x — for the
          # W2.1 tracer-bullet we surface non-zero pytest exit as a
          # drift signal and tail the log into the issue body.
          set +e
          pytest tests/real_cursor_cloud/ -m real_cursor_cloud -q --no-header \
            -o cache_dir=.drift/.pytest_cache \
            > .drift/captured/pytest.log 2>&1
          rc=$?
          set -e
          echo "pytest_rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "drift detected (pytest exit=$rc)"
          fi

      - name: Build drift report
        if: ${{ steps.drift.outputs.pytest_rc != '0' }}
        run: |
          set -euo pipefail
          {
            echo "## Cloud fixtures drift detected"
            echo
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Suggested action: review the captured pytest log; if Cursor Cloud has changed an API shape, refresh the matching fixture under \`tests/fixtures/cloud/\` and re-run \`scripts/regen_fixture_checksums.py\`."
            echo
            echo "<details><summary>pytest log (tail 200 lines)</summary>"
            echo
            echo '```'
            tail -200 .drift/captured/pytest.log
            echo '```'
            echo
            echo "</details>"
          } > .drift/drift.md

      - name: Upload drift artifact
        if: ${{ steps.drift.outputs.pytest_rc != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: cloud-fixtures-drift
          path: .drift/

      - name: Open `fixtures-drift` issue
        if: ${{ steps.drift.outputs.pytest_rc != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT_DATE: ${{ github.run_started_at }}
        run: |
          set -euo pipefail
          gh issue create \
            --title "[fixtures-drift] Cloud fixtures drift detected ($DRIFT_DATE)" \
            --body-file .drift/drift.md \
            --label fixtures-drift

      - name: Surface red on the schedule run
        if: ${{ steps.drift.outputs.pytest_rc != '0' }}
        run: exit 1
