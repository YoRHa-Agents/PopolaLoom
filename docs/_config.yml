# Jekyll config for the PopolaLoom GitHub Pages site.
# Source: docs/ (set in repo Settings → Pages → Source = docs/)
title: PopolaLoom
description: >-
  Meta-orchestrator over local agent CLIs (Cursor / Claude Code /
  Codex / Kimi / GitHub Copilot). Per-task isolation, persistent
  process bus, HITL via 5 channels — all on a single popolad UDS
  daemon. Sibling of ArkTower; built on top of DevolaFlow.

# Theme: NieR-Popola custom layout in _layouts/default.html
# (cream + amber + gold serif aesthetic — see assets/css/nier-popola.css).
# No `theme:` key — we ship our own layout, fonts via Google Fonts CDN,
# zero Gemfile / bundle install needed for Pages-hosted builds.
url: https://YoRHa-Agents.github.io
baseurl: /PopolaLoom

# Site version (rendered in the footer by _layouts/default.html)
popola_version: "0.9.7"

# Site metadata
github:
  repository_url: https://github.com/YoRHa-Agents/PopolaLoom
  repository_nwo: YoRHa-Agents/PopolaLoom

# Markdown
markdown: kramdown
kramdown:
  syntax_highlighter: rouge

# Build plugins
plugins:
  - jekyll-relative-links

# Files to exclude from the Pages build (keep them in git but not
# rendered as Jekyll pages)
exclude:
  - "*.sh"
  - "*.toml"
  - "Makefile"
  - "vendor/"
  - "node_modules/"

# Render Markdown extensionless links inside docs/ as relative
relative_links:
  enabled: true
  collections: true

# Default front-matter — every Markdown page picks up _layouts/default.html
# unless it explicitly overrides `layout:` in its own front-matter.
defaults:
  - scope:
      path: ""
    values:
      layout: default
