<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">PopolaLoom banner</title>
  <desc id="desc">A cream and amber project banner for PopolaLoom with a woven motif and the tagline in Chinese and English.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f1e9"/>
      <stop offset="100%" stop-color="#ebe0cf"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="28%" r="58%">
      <stop offset="0%" stop-color="#fff7dc" stop-opacity="0.96"/>
      <stop offset="42%" stop-color="#e8c986" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#e8c986" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6936"/>
      <stop offset="50%" stop-color="#c89a4a"/>
      <stop offset="100%" stop-color="#8a6936"/>
    </linearGradient>
    <pattern id="threads" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M24 0v48M0 24h48" fill="none" stroke="#d4c4a8" stroke-opacity="0.42" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#threads)" opacity="0.55"/>
  <rect x="18" y="18" width="1244" height="284" rx="14" fill="none" stroke="#d4c4a8" stroke-width="2"/>
  <circle cx="640" cy="92" r="164" fill="url(#halo)"/>

  <g fill="none" stroke="#c89a4a" stroke-opacity="0.58" stroke-width="1.5">
    <path d="M72 56h168"/>
    <path d="M1040 56h168"/>
    <path d="M72 264h168"/>
    <path d="M1040 264h168"/>
  </g>

  <g transform="translate(118 70)" fill="none" stroke="#c89a4a" stroke-linecap="round">
    <circle cx="88" cy="90" r="58" stroke-width="3"/>
    <polygon points="88,20 158,90 88,160 18,90" stroke-width="2"/>
    <path d="M52 54l72 72M52 126l72-72" stroke="#8a6936" stroke-opacity="0.55" stroke-width="1.8"/>
    <path d="M88 6v36M88 138v36M4 90h36M136 90h36" stroke-width="2"/>
    <circle cx="88" cy="90" r="10" fill="#c89a4a" stroke="none"/>
  </g>

  <g transform="translate(986 70)" fill="none" stroke="#c89a4a" stroke-linecap="round">
    <circle cx="88" cy="90" r="58" stroke-width="3"/>
    <polygon points="88,20 158,90 88,160 18,90" stroke-width="2"/>
    <path d="M52 54l72 72M52 126l72-72" stroke="#8a6936" stroke-opacity="0.55" stroke-width="1.8"/>
    <path d="M88 6v36M88 138v36M4 90h36M136 90h36" stroke-width="2"/>
    <circle cx="88" cy="90" r="10" fill="#c89a4a" stroke="none"/>
  </g>

  <g text-anchor="middle">
    <text x="640" y="68" fill="#8a6936" font-family="JetBrains Mono, 'SF Mono', Consolas, monospace" font-size="16" letter-spacing="3">A LOOM THAT WEAVES AGENTS</text>
    <text x="640" y="146" fill="#2b1f14" font-family="Cormorant Garamond, Georgia, serif" font-size="92" font-weight="700" letter-spacing="3">PopolaLoom</text>
    <text x="640" y="228" fill="#5d4a37" font-family="'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', Georgia, serif" font-size="28" font-style="italic" letter-spacing="0.4">&#36328; CLI &#20803;&#32534;&#25490;&#22120; &#183; cross-CLI meta-orchestrator</text>
  </g>

  <g fill="url(#gold)" stroke="url(#gold)" stroke-width="2">
    <path d="M392 188h188"/>
    <path d="M700 188h188"/>
    <polygon points="640,180 648,188 640,196 632,188"/>
  </g>
</svg>
