[project]
name = "popolaloom"
version = "0.0.1"
description = "Meta-orchestrator over local agent CLIs"
root = "."

[paths]
src = "src/popolaloom"
tests = "tests"
golden = "data/golden_test_set"
samples = "data/eval_samples"

# 8-dim 自评维度 (出处: spec.md §3.4.1 self-bootstrap 5 例 + 06 §6.1 Day-6)
# 直接借鉴 ArkTower 8-dim 框架,但替换为 PopolaLoom 特有维度。
# v0.3.0 F4.E: token_budget_compliance → hitl_handleability (D3.10 1:1 swap).
[eval]
dimensions = [
    "dispatch_isolation",
    "cycle_convergence",
    "hitl_latency",
    "attach_correctness",
    "cross_cli_handoff",
    "single_threaded_writes",
    "event_log_completeness",
    "hitl_handleability",
]

# 各维度权重之和 = 1.00 (出处: 06 §6.1 + spec.md §7.3 ev2)
# auto-merge gate composite_score ≥ 0.85 (standard profile) 才允许通过。
# v0.3.0 F4.E: hitl_handleability replaces token_budget_compliance (weight 0.10 retained).
[eval.weights]
dispatch_isolation = 0.15
cycle_convergence = 0.15
hitl_latency = 0.15
attach_correctness = 0.10
cross_cli_handoff = 0.15
single_threaded_writes = 0.10
event_log_completeness = 0.10
hitl_handleability = 0.10

[benchmark]
rounds = 3
convergence_threshold = 0.05

[iterate]
max_rounds = 5
threshold = 0.05
